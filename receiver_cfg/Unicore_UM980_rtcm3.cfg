# Config file for using a Unicore UM980 with RTKBase (RTCM3)
# SIGNALGROUP will reset the device
CONFIG SIGNALGROUP 2
CONFIG SBAS ENABLE AUTO
MODE BASE 1 TIME 60 1
# Ephemerides every 30 s: they rarely change, and at 1 s they made up
# about half of the recorded file
rtcm1019 30
rtcm1020 30
rtcm1042 30
rtcm1044 30
rtcm1045 30
rtcm1046 30
rtcm1077 1
rtcm1087 1
rtcm1097 1
rtcm1107 1
rtcm1117 1
rtcm1127 1
MASK 0
